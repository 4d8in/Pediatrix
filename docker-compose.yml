# Infrastructure de données locale de Pédiatrix : HAPI FHIR + PostgreSQL.
# Offline-first : aucune image "latest", aucun service cloud.

services:
  postgres:
    image: docker.io/library/postgres:16.14-alpine
    container_name: pediatrix-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    # Pas de "ports:" ici : Postgres reste accessible uniquement sur le réseau
    # Docker interne, jamais exposé sur l'hôte (donc jamais sur 0.0.0.0).

  hapi-fhir:
    image: docker.io/hapiproject/hapi:v8.10.0-2
    container_name: pediatrix-hapi-fhir
    restart: always
    # HAPI n'a pas d'authentification propre : toute personne qui l'atteint peut lire
    # et modifier les dossiers en contournant les rôles du backend. Il n'est donc
    # publié que sur l'hôte lui-même (le backend Node tourne sur la même machine).
    # Si le backend est sur une autre machine, passez par un tunnel ou un réseau
    # privé dédié plutôt que d'ouvrir ce port sur le LAN.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Connexion au Postgres du service ci-dessus (binding Spring Boot standard).
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      # Nom de variable imposé par le application.yaml source de HAPI (placeholder
      # explicite ${HIBERNATE_DIALECT:...}), ce n'est pas une convention générique.
      HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"
      # FHIR R4 explicite (déjà la valeur par défaut de l'image, fixée ici par robustesse).
      HAPI_FHIR_FHIR_VERSION: "R4"
    healthcheck:
      # Pas de shell ni curl/wget dans cette image (vérifié : "sh"/"curl" introuvables
      # via docker exec) ; HealthCheck est la classe Java embarquée prévue pour ça.
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # Backend Pédiatrix (API, authentification, règles métier). Il est le seul à parler
  # à HAPI ; les postes ne contactent que lui. Construction : docker compose build backend.
  # Réglages dans apps/backend/.env ; l'adresse de HAPI est imposée ci-dessous.
  backend:
    build: ./apps/backend
    image: pediatrix-backend:local
    container_name: pediatrix-backend
    restart: always
    env_file: ./apps/backend/.env
    environment:
      HAPI_FHIR_URL: "http://hapi-fhir:8080/fhir"
      PORT: "3001"
    ports:
      # BACKEND_BIND=127.0.0.1 avec le profil tls : seul Caddy (3443) reste joignable depuis le réseau.
      - "${BACKEND_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - backend_data:/app/data
    depends_on:
      hapi-fhir:
        condition: service_healthy
    profiles: ["full"]

  # Sauvegarde automatique quotidienne (base clinique + données du backend) vers ./backups,
  # chiffrée si BACKUP_PASSPHRASE est défini dans le .env racine.
  backup:
    build: ./deploy/backup
    image: pediatrix-backup:local
    container_name: pediatrix-backup
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - backend_data:/backend-data:ro
      - ./scripts/docker/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Chiffrement TLS du backend sur le LAN (https://<serveur>:3443), certificat d'une
  # autorité interne. Profil optionnel : docker compose --profile full --profile tls up -d
  tls:
    image: docker.io/library/caddy:2-alpine
    container_name: pediatrix-tls
    restart: always
    environment:
      TLS_HOST: ${TLS_HOST:-pediatrix.lan}
    ports:
      - "3443:3443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
    profiles: ["tls"]

volumes:
  postgres_data:
    name: pediatrix_postgres_data
  backend_data:
    name: pediatrix_backend_data
  caddy_data:
    name: pediatrix_caddy_data
    